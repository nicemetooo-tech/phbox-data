name: shards
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: split
        run: python split.py
      - name: commit
        run: |
          git config user.name "phbox-bot"
          git config user.email "bot@users.noreply.github.com"
          git add hot.json matrix.json pool.json
          git diff --cached --quiet || git commit -m "shards $(date -u +%F_%H%M)"
          git push
