name: crawl
on:
  schedule:
    - cron: '30 16 * * 0'   # 每周日 UTC16:30（北京周一 00:30）跑 pool 大库
  workflow_dispatch:
    inputs:
      scope: {description: 'hot / pool / all', required: true, default: 'pool'}
      gap: {description: '请求间隔秒', required: false, default: '7'}
      maxreq: {description: '每批最大请求数', required: false, default: '150'}
      pages: {description: '每子项页数', required: false, default: '2'}
permissions:
  contents: write
  actions: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: run
        env:
          GIT_COMMIT: '1'
          SCOPE: ${{ github.event.inputs.scope || 'pool' }}
          GAP: ${{ github.event.inputs.gap || '7' }}
          MAXREQ: ${{ github.event.inputs.maxreq || '150' }}
          PAGES: ${{ github.event.inputs.pages || '2' }}
          MAXSECONDS: '2700'
        run: python pool_gh.py
      - name: split
        run: python split.py
      - name: commit
        run: |
          git config user.name "phbox-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json hot.json pool.json pool_progress.json fail.json remaining.txt || true
          git commit -m "update $(date -u +%FT%TZ)" || echo none
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push && break || sleep 10
          done

      - name: chain next batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PAGES: ${{ github.event.inputs.pages || '2' }}
          NEXT_GAP: ${{ github.event.inputs.gap || '7' }}
          NEXT_MAXREQ: ${{ github.event.inputs.maxreq || '150' }}
        run: |
          n=$(cat remaining.txt 2>/dev/null || echo 0)
          echo "remaining=$n pages=$NEXT_PAGES"
          if [ "$n" -gt 0 ]; then
            sleep 30
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/crawl.yml/dispatches \
              -d "{\"ref\":\"main\",\"inputs\":{\"scope\":\"pool\",\"gap\":\"$NEXT_GAP\",\"maxreq\":\"$NEXT_MAXREQ\",\"pages\":\"$NEXT_PAGES\"}}"
            echo dispatched
          fi
