name: crawl
on:
  workflow_dispatch:
    inputs:
      scope: {description: 'hot 或 matrix', required: true, default: 'hot'}
      gap: {description: '请求间隔秒', required: false, default: '10'}
      maxreq: {description: '每次最大请求数', required: false, default: '300'}
  schedule:
    - cron: '10 * * * *'
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: run
        env:
          SCOPE: ${{ github.event.inputs.scope || 'hot' }}
          GAP: ${{ github.event.inputs.gap || '10' }}
          MAXREQ: ${{ github.event.inputs.maxreq || '300' }}
        run: python crawl_gh.py
      - name: commit
        run: |
          git config user.name "phbox-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json progress.json
          git commit -m "update $(date -u +%FT%TZ)" || echo none
          git push
