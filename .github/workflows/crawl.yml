name: crawl
on:
  workflow_dispatch:
    inputs:
      scope: {description: 'hot / pool / all', required: true, default: 'pool'}
      gap: {description: '请求间隔秒', required: false, default: '7'}
      maxreq: {description: '每批最大请求数', required: false, default: '150'}
      pages: {description: '每子项页数', required: false, default: '2'}
  schedule:
    - cron: '5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: run
        env:
          GIT_COMMIT: '1'
          SCOPE: ${{ github.event.inputs.scope || 'pool' }}
          GAP: ${{ github.event.inputs.gap || '7' }}
          MAXREQ: ${{ github.event.inputs.maxreq || '150' }}
          PAGES: ${{ github.event.inputs.pages || '2' }}
          MAXSECONDS: '2700'
        run: python pool_gh.py
      - name: commit
        run: |
          git config user.name "phbox-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json pool_progress.json fail.json remaining.txt || true
          git commit -m "update $(date -u +%FT%TZ)" || echo none
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push && break || sleep 10
          done
      - name: chain next batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(cat remaining.txt 2>/dev/null || echo 0)
          echo "remaining=$n"
          if [ "$n" -gt 0 ]; then
            sleep 60
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/crawl.yml/dispatches \
              -d '{"ref":"main","inputs":{"scope":"pool","gap":"7","maxreq":"150","pages":"2"}}'
            echo dispatched
          fi
