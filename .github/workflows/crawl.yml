name: crawl
on:
  workflow_dispatch:
    inputs:
      scope: {description: 'hot 或 matrix', required: true, default: 'hot'}
      gap: {description: '请求间隔秒', required: false, default: '6'}
      maxreq: {description: '每次最大请求数', required: false, default: '200'}
  schedule:
    - cron: '10 * * * *'
permissions:
  contents: write
  actions: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: run
        env:
          GIT_COMMIT: '1'
          SCOPE: ${{ github.event.inputs.scope || 'hot' }}
          GAP: ${{ github.event.inputs.gap || '6' }}
          MAXREQ: ${{ github.event.inputs.maxreq || '200' }}
        run: python crawl_gh.py
      - name: commit
        run: |
          git config user.name "phbox-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json progress.json fail.json remaining.txt || true
          git commit -m "update $(date -u +%FT%TZ)" || echo none
          git push

      - name: chain next batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(cat remaining.txt 2>/dev/null || echo 0)
          echo "remaining=$n"
          if [ "$n" -gt 0 ]; then
            curl -s -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               https://api.github.com/repos/${{ github.repository }}/actions/workflows/crawl.yml/dispatches               -d '{"ref":"main","inputs":{"scope":"matrix","gap":"6","maxreq":"200"}}'
            echo dispatched
          fi
