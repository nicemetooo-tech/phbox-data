name: counts
on:
  workflow_dispatch:
    inputs:
      gap: {description: '间隔秒', required: false, default: '4'}
permissions:
  contents: write
jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: run
        env:
          GIT_COMMIT: '1'
          GAP: ${{ github.event.inputs.gap || '4' }}
        run: python counts.py
